name: Build iOS IPA

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build RedBeatPlayer IPA
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Build Archive
        run: |
          xcodebuild archive \
            -project RedBeatPlayer.xcodeproj \
            -scheme RedBeatPlayer \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/RedBeatPlayer.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package Unsigned IPA
        run: |
          mkdir -p build/Payload
          cp -r build/RedBeatPlayer.xcarchive/Products/Applications/RedBeatPlayer.app build/Payload/
          cd build
          zip -r RedBeatPlayer-v5.0.ipa Payload
          cd ..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RedBeatPlayer-v5.0-iOS-IPA
          path: build/RedBeatPlayer-v5.0.ipa
          if-no-files-found: error
